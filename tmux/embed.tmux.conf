# embed.tmux.conf — embed workflow tmux bindings
#
# Source this from your main ~/.tmux.conf with:
#   source-file ~/work/embedded_systems/embed-workflow/tmux/embed.tmux.conf
#
# Bindings use your existing prefix (C-s) and call helper scripts from
# ~/.local/bin/embed-popup-*. Single-layer escaping — no nested quote hell.
#
# Requires tmux >= 3.2 (for display-popup). Check with: tmux -V

# Unbind tmux defaults we're overriding (the built-in `prefix + t` shows a clock)
unbind-key t

# ─── Popups ──────────────────────────────────────────────────────────────────

# prefix + g   floating shell in current path
bind-key g display-popup -E -d "#{pane_current_path}" -w 85% -h 70% embed-popup-shell

# prefix + t   tio serial monitor (reads .embed/serial.sh if present, else defaults)
bind-key t display-popup -E -d "#{pane_current_path}" -w 90% -h 70% embed-popup-serial

# prefix + B   build (stays open so you can see errors)
bind-key B display-popup -E -d "#{pane_current_path}" -w 90% -h 80% embed-popup-build

# prefix + F   flash
bind-key F display-popup -E -d "#{pane_current_path}" -w 90% -h 70% embed-popup-flash

# prefix + E   mass-erase (asks to confirm)
bind-key E display-popup -E -d "#{pane_current_path}" -w 85% -h 60% embed-popup-erase

# prefix + S   fuzzy-pick embed project
bind-key S display-popup -E -w 70% -h 60% \
    "embed list projects 2>/dev/null | sed 1d | awk '{print $1}' | fzf --prompt='project> ' | xargs -r -I{} embed open {}"
