# Board manifest: Nucleo-F091RC (STM32F091RC, Cortex-M0)
BOARD_ID = "nucleo-f091rc"
BOARD_NAME = "Nucleo-F091RC"
MCU = "STM32F091RC"

# CPU - Cortex-M0, NO FPU 
CPU = "cortex-m0"
FPU = "none"
FLOAT_ABI = "soft"

# Memory map (STM32F091RC: 256 KB flash, 32 KB SRAM)
FLASH_ORIGIN="0x08000000"
FLASH_SIZE="256K"
RAM_ORIGIN="0x20000000"
RAM_SIZE="32K"

# Toolchain
TOOLCHAIN_PREFIX="arm-none-eabi-"


# OpenOCD
OPENOCD_CFG="board/st_nucleo_f0.cfg"
OPENOCD_CHIP_FAMILY="stm32f0x"

# Probe
PROBE="stlink-v2-1"


# Serial (Nucleo onboard ST-Link/V2-1 VCP → USART2)
SERIAL_PORT="/dev/ttyACM0"
SERIAL_BAUD="115200"


# User LED LD2 = PA5
USER_LED_PORT="A"
USER_LED_PIN="5"
