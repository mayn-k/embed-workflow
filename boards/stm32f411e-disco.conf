# Board manifest: STM32F411E-Discovery (STM32F411VE, Cortex-M4F)
# Sourced by `embed` CLI. Keep it as plain key=value (no spaces around =).

BOARD_ID="stm32f411e-disco"
BOARD_NAME="STM32F411E-Discovery"
MCU="STM32F411VE"

# CPU / FPU
CPU="cortex-m4"
FPU="fpv4-sp-d16"
FLOAT_ABI="hard"

# Memory map (STM32F411VE: 512 KB flash, 128 KB SRAM)
FLASH_ORIGIN="0x08000000"
FLASH_SIZE="512K"
RAM_ORIGIN="0x20000000"
RAM_SIZE="128K"

# Toolchain
TOOLCHAIN_PREFIX="arm-none-eabi-"

# OpenOCD: no F411-specific Discovery config ships with OpenOCD 0.12.
# stm32f4discovery.cfg is generic (ST-Link + stm32f4x target), works for F411.
OPENOCD_CFG="board/stm32f4discovery.cfg"
OPENOCD_CHIP_FAMILY="stm32f4x"

# Probe
PROBE="stlink-v2"

# Serial: the lab uses USART2 on PA2 (TX) / PA3 (RX) through a USB-TTL
# adapter, which shows up as /dev/ttyUSB*. Newer board revisions (MB1115D)
# have an ST-LINK/V2-A with a virtual COM port on /dev/ttyACM0 instead.
# Override per project in .embed/board.conf.
SERIAL_PORT="/dev/ttyUSB0"
SERIAL_BAUD="115200"

# User LEDs on port D: PD12 green, PD13 orange, PD14 red, PD15 blue
USER_LED_PORT="D"
USER_LED_PIN="12"

# No quick-mode template for this MCU family (the bundled register header is
# STM32L4). Projects on this board must be created with --assignment.
TEMPLATES="assignment"
