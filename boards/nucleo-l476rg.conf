# Board manifest: Nucleo-L476RG
# Sourced by `embed` CLI. Keep it as plain key=value (no spaces around =).

BOARD_ID="nucleo-l476rg"
BOARD_NAME="Nucleo-L476RG"
MCU="STM32L476RG"

# CPU / FPU
CPU="cortex-m4"
FPU="fpv4-sp-d16"
FLOAT_ABI="hard"

# Memory map (STM32L476RG: 1 MB flash, 96 KB SRAM1 + 32 KB SRAM2)
FLASH_ORIGIN="0x08000000"
FLASH_SIZE="1024K"
RAM_ORIGIN="0x20000000"
RAM_SIZE="96K"

# Toolchain
TOOLCHAIN_PREFIX="arm-none-eabi-"

# OpenOCD
OPENOCD_CFG="board/st_nucleo_l4.cfg"
OPENOCD_CHIP_FAMILY="stm32l4x"

# Probe
PROBE="stlink-v2-1"

# Serial (Nucleo onboard ST-Link V2-1 VCP → /dev/ttyACM0)
# Override per-project by editing .embed/board.conf after creation
SERIAL_PORT="/dev/ttyACM0"
SERIAL_BAUD="115200"

# LED pin (Nucleo user LED LD2 = PA5)
USER_LED_PORT="A"
USER_LED_PIN="5"
